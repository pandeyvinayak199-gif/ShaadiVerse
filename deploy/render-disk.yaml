# OPTIONAL PAID STORAGE. Import only after deliberately choosing a paid Render service.
# Does not change the existing free demo. Back up any existing database first.
services:
  - type: web
    name: shaadi-sync-private
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: shaadi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_PATH
        value: /var/data/shaadi.sqlite3
      - key: DEMO_MODE
        value: "0"
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false

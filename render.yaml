# Fresh-start wedding app. Set DATABASE_URL and Twilio Verify credentials in Render.
# Without DATABASE_URL, the local fallback is ephemeral.
services:
  - type: web
    name: shaadiverse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_SANDBOX_OTP
        value: "0"
      - key: APP_MODE
        value: user
      - key: AUTH_PROVIDER
        value: google
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /tmp/shaadi.sqlite3
